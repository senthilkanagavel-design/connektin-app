name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: CONNEKTIN-PHASE2

      - name: Build
        run: npx vite build
        working-directory: CONNEKTIN-PHASE2

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Staging
        run: firebase deploy --only hosting --project connektin-staging --token "${{ secrets.FIREBASE_TOKEN }}"
        working-directory: CONNEKTIN-PHASE2
