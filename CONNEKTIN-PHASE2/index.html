<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A1628" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ConnektIn" />
    <!-- Primary Meta -->
    <meta name="title" content="ConnektIn" />
    <meta name="description" content="The career community for healthcare professionals. Connect, grow and find opportunities in Medical Billing, Coding and more." />
    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://connektin.in/" />
    <meta property="og:title"       content="ConnektIn" />
    <meta property="og:description" content="The career community for healthcare professionals. Connect, grow and find opportunities." />
    <meta property="og:image"       content="https://connektin.in/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name"   content="ConnektIn" />
    <!-- Twitter -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:url"         content="https://connektin.in/" />
    <meta name="twitter:title"       content="ConnektIn" />
    <meta name="twitter:description" content="The career community for healthcare professionals." />
    <meta name="twitter:image"       content="https://connektin.in/og-image.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <title>ConnektIn</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && !['localhost', '127.0.0.1'].includes(location.hostname)) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('SW registered'))
            .catch((err) => console.log('SW failed', err));
        });
      }
    </script>
  </body>
</html>
