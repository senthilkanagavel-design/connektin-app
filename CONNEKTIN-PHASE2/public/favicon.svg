<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Navy background -->
  <rect width="32" height="32" fill="#0A1628"/>

  <!-- Subtle blue center glow -->
  <radialGradient id="glow" cx="47%" cy="45%" r="60%">
    <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#0A66C2" stop-opacity="0"/>
  </radialGradient>
  <rect width="32" height="32" fill="url(#glow)"/>

  <!-- White "C" arc: center (14.7, 16), r=8.5, from 54° to 306° clockwise -->
  <path
    d="M 19.7 22.9 A 8.5 8.5 0 1 1 19.7 9.1"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3.7"
    stroke-linecap="round"
  />

  <!-- Teal dot (top of "i") -->
  <circle cx="21.6" cy="11.3" r="2.3" fill="#0D9488"/>

  <!-- Teal stem (body of "i") -->
  <rect x="20.75" y="14.75" width="1.7" height="4.9" rx="0.85" fill="#0D9488"/>
</svg>
